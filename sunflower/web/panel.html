<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunflower · 语音编程</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --fg: #e6edf3; --dim: #8b949e;
    --sun: #f5b301; --ok: #3fb950; --bad: #f85149; --info: #58a6ff; --warn: #d29922;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans); }
  body { display: grid; grid-template-rows: auto 1fr auto; gap: 1.2vh; padding: 2vh 2vw; font-size: clamp(14px, 1.6vw, 26px); }
  header { display: flex; align-items: center; gap: 1.2vw; }
  .brand { font-weight: 700; font-size: 1.3em; letter-spacing: .02em; }
  .brand b { color: var(--sun); }
  .pill { padding: .25em .8em; border-radius: 999px; font-size: .8em; font-weight: 600; border: 1px solid var(--line); color: var(--dim); }
  .pill.running { color: #111; background: var(--sun); border-color: var(--sun); animation: pulse 1.6s ease-in-out infinite; }
  .pill.idle { color: var(--ok); border-color: var(--ok); }
  .pill.offline { color: var(--bad); border-color: var(--bad); }
  @keyframes pulse { 50% { opacity: .65; } }
  .task { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
  .timer { font-family: var(--mono); color: var(--dim); }
  .talk { font: inherit; font-weight: 600; padding: .45em 1.1em; border-radius: 999px; border: 2px solid var(--sun); background: transparent; color: var(--sun); cursor: pointer; white-space: nowrap; }
  .aside { color: var(--dim); font-size: .8em; text-decoration: none; white-space: nowrap; }
  .aside:hover, .aside:focus-visible { color: var(--fg); text-decoration: underline; }
  .talk:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
  .talk.recording { background: var(--bad); border-color: var(--bad); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
  .talk.recognizing { border-color: var(--info); color: var(--info); }
  .talk.offline { border-color: var(--line); color: var(--dim); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 1.2vw; min-height: 0; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1.4vh 1.2vw; display: flex; flex-direction: column; min-height: 0; }
  h2 { margin: 0 0 1vh; font-size: .75em; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .12em; }
  .scroll { overflow-y: auto; flex: 1; min-height: 0; scroll-behavior: smooth; }
  .bubble { margin: .5em 0; padding: .55em .8em; border-radius: 12px; line-height: 1.45; max-width: 92%; }
  .bubble.user { background: #1f2a3a; border: 1px solid #284566; }
  .bubble.assistant { background: #2a2414; border: 1px solid #5c4a12; margin-left: auto; }
  .bubble small { display: block; font-size: .65em; color: var(--dim); margin-bottom: .2em; }
  .row { display: grid; grid-template-columns: 1.6em 1fr; gap: .5em; padding: .35em 0; border-bottom: 1px dashed #21262d; line-height: 1.4; animation: in .25s ease-out; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .row .t { font-family: var(--mono); font-size: .82em; word-break: break-all; }
  .row.msg .t, .row.user .t { font-family: var(--sans); font-size: 1em; }
  .row.cmd .t { color: var(--info); } .row.cmd_ok .t { color: var(--ok); } .row.cmd_fail .t { color: var(--bad); }
  .row.file .t { color: var(--sun); } .row.warn .t { color: var(--warn); } .row.system .t, .row.think .t { color: var(--dim); }
  .row.user .t { color: #9ecbff; font-weight: 600; }
  .row.user { margin-top: .8em; border-top: 2px solid #284566; border-bottom: none; padding-top: .7em; }
  footer { display: grid; grid-template-columns: 1fr auto; gap: 1.2vw; align-items: end; }
  pre.diff { margin: 0; font-family: var(--mono); font-size: .7em; color: var(--dim); white-space: pre-wrap; max-height: 16vh; overflow: hidden; }
  .say { font-size: .95em; color: var(--sun); text-align: right; }
  .empty { color: var(--dim); font-style: italic; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } section.voice { max-height: 30vh; } }
</style>
</head>
<body>
<header>
  <div class="brand">🌻 <b>Sunflower</b> 语音编程</div>
  <span id="pill" class="pill offline">连接中</span>
  <div id="task" class="task"></div>
  <div id="timer" class="timer"></div>
  <a id="tryout" class="aside" href="/tryout">试音</a>
  <button id="talk" class="talk" type="button" aria-live="polite">🎙 空格 / 点这里说话</button>
</header>
<main>
  <section class="voice"><h2>🎙 对话</h2><div id="voice" class="scroll"><div class="empty">按空格、翻页笔或右上角按钮，说出你的需求…</div></div></section>
  <section><h2>⚙️ 执行流 · Codex<span id="channel"></span></h2><div id="log" class="scroll"><div class="empty">等待任务</div></div></section>
</main>
<footer>
  <pre id="diff" class="diff"></pre>
  <div id="say" class="say"></div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const ICON = { user: "🗣", cmd: "▶", cmd_ok: "✔", cmd_fail: "✘", file: "✎", msg: "💬", warn: "⚠", system: "·", think: "…" };
const token = new URLSearchParams(location.search).get("t") || "";
$("tryout").href = "/tryout" + location.search;  // 别的机器带着令牌开的面板，试音页也带上
let startedAt = null, timerId = null;

function clearEmpty(el) { const e = el.querySelector(".empty"); if (e) e.remove(); }
function stick(el, fn) { const atEnd = el.scrollHeight - el.scrollTop - el.clientHeight < 80; fn(); if (atEnd) el.scrollTop = el.scrollHeight; }
function addRow(kind, text) {
  const el = $("log"); clearEmpty(el);
  stick(el, () => {
    const r = document.createElement("div"); r.className = "row " + kind;
    r.innerHTML = `<span>${ICON[kind] || "·"}</span><span class="t"></span>`;
    r.querySelector(".t").textContent = text; el.appendChild(r);
    while (el.children.length > 400) el.firstChild.remove();
  });
}
function addBubble(role, text, ts) {
  // 一句话的 TTS 分句到达，8s 内连续的播报并成一个气泡；按事件时间判断，回放历史时也不会误并
  const el = $("voice"); clearEmpty(el);
  const t = (ts || Date.now() / 1000) * 1000;
  stick(el, () => {
    const last = el.lastElementChild;
    if (role === "assistant" && last && last.classList.contains("assistant") && t - (last._t || 0) < 8000) {
      last.querySelector("span").textContent += text; last._t = t; return;
    }
    const b = document.createElement("div"); b.className = "bubble " + role; b._t = t;
    b.innerHTML = `<small>${role === "user" ? "你" : "太阳花"}</small><span></span>`;
    b.querySelector("span").textContent = text; el.appendChild(b);
  });
}
function tick() { if (startedAt) $("timer").textContent = Math.floor(Date.now() / 1000 - startedAt) + "s"; }
function setState(d) {
  const p = $("pill");
  if (d.state === "running") {
    p.className = "pill running"; p.textContent = (d.resume ? "继续执行" : "执行中") + (d.read_only ? " · 只读" : "");
    $("task").textContent = d.task || ""; startedAt = d.started || Date.now() / 1000;
    clearInterval(timerId); timerId = setInterval(tick, 500); tick();
  } else {
    if (d.reset) { $("log").innerHTML = '<div class="empty">新会话 · 等待任务</div>'; $("voice").innerHTML = '<div class="empty">按空格、翻页笔或右上角按钮，说出你的需求…</div>'; $("diff").textContent = ""; $("say").textContent = ""; $("task").textContent = ""; $("timer").textContent = ""; }
    p.className = "pill idle"; p.textContent = "空闲";
    clearInterval(timerId); startedAt = null;
    if (d.task) { $("task").textContent = (d.exit === 0 ? "✔ " : "✘ ") + d.task; $("timer").textContent = (d.elapsed ?? "") + "s"; }
  }
}
// 说话按键（#40）：面板就是屏幕上的窗口，按键落在这里；经主机转给桌面设备，设备录音并回报状态
const TALK_KEYS = new Set([" ", "Enter", "PageUp", "PageDown", "ArrowLeft", "ArrowRight", "b", "B", "F5"]);  // 翻页笔常见键
const TALK_TEXT = { idle: "🎙 空格 / 点这里说话", recording: "● 录音中 · 说完再按一次", recognizing: "识别中…" };
let mic = "idle", muted = false, ackTimer = null, backTimer = null;
function showTalk(state, text) {
  const b = $("talk"); b.className = "talk " + state;
  b.textContent = (text || TALK_TEXT[state] || TALK_TEXT.idle) + (muted && state === "idle" ? " · 🔇" : "");
}
function setMic(d) {
  if (typeof d.muted === "boolean") muted = d.muted;
  if (d.state) { mic = d.state; clearTimeout(ackTimer); }
  clearTimeout(backTimer);
  if (mic === "recognizing") backTimer = setTimeout(() => { mic = "idle"; showTalk("idle"); }, 10000);  // 没识别出字也回到可说
  showTalk(mic);
}
function flash(text) { showTalk("offline", text); clearTimeout(backTimer); backTimer = setTimeout(() => setMic({ state: mic }), 4000); }
async function press(key) {
  if (key === "talk") { clearTimeout(ackTimer); ackTimer = setTimeout(() => flash("设备没响应"), 3000); }
  try {
    const r = await fetch("/api/key", { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, token && { "Authorization": "Bearer " + token }), body: JSON.stringify({ key }) });
    const d = await r.json();
    if (r.status === 401) { clearTimeout(ackTimer); return flash("别的机器打开面板要带 ?t= 令牌"); }
    if (!d.ok) { clearTimeout(ackTimer); flash(d.say || "按键没送到"); }
  } catch (e) { clearTimeout(ackTimer); flash("主机连不上"); }
}
document.addEventListener("keydown", (e) => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  let key = null;
  if (TALK_KEYS.has(e.key)) key = "talk";
  else if ("12345".includes(e.key) && e.key.length === 1) key = e.key;
  else if (e.key === "m" || e.key === "M") key = "mute";
  if (!key) return;
  e.preventDefault();  // 空格不滚动、F5 不刷新、回车不重复点按钮
  press(key);
});
$("talk").addEventListener("click", (e) => { if (e.detail > 0) press("talk"); });  // 键盘触发的 click 已由 keydown 处理

function connect() {
  const es = new EventSource(token ? "/events?t=" + encodeURIComponent(token) : "/events");
  es.addEventListener("state", (e) => { const d = JSON.parse(e.data); if (d.channel) $("channel").textContent = " · " + d.channel; setState(d); });
  es.addEventListener("log", (e) => { const d = JSON.parse(e.data); if (d.text) addRow(d.kind, d.text); });
  es.addEventListener("voice", (e) => { const d = JSON.parse(e.data); if (d.text) addBubble(d.role, d.text, d.ts); });
  es.addEventListener("diff", (e) => { $("diff").textContent = JSON.parse(e.data).stat || ""; });
  es.addEventListener("device", (e) => setMic(JSON.parse(e.data)));
  es.addEventListener("announce", (e) => { $("say").textContent = "🔊 " + JSON.parse(e.data).text; });
  es.onerror = () => { $("pill").className = "pill offline"; $("pill").textContent = "重连中"; };
  es.onopen = () => { if ($("pill").classList.contains("offline")) { $("pill").className = "pill idle"; $("pill").textContent = "空闲"; } };
}
connect();
</script>
</body>
</html>
