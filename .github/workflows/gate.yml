# 与本地同一条门禁：scripts/gate.sh。私有免费仓没有 required check，
# 合入由 scripts/merge.sh 把关——它要求本 workflow 在 PR 头提交上全绿。
name: gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited：改 PR 正文的「规格」段要重跑
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 默认 6 小时：apt 源卡住时整个 PR 会被挂半天
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: ffmpeg（TG 入口的语音转码 OGG/Opus ↔ PCM）
        timeout-minutes: 6
        # apt 源偶尔卡住不动（2026-10-23 实测 8 分钟无输出）：单次限 100 s，最多 3 次
        run: |
          for i in 1 2 3; do
            timeout 100 sh -c 'sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg' && exit 0
            echo "apt 第 $i 次没装上，重试"
          done
          exit 1
      - name: scripts/gate.sh
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/gate.sh --base "origin/$BASE_REF"
          else
            scripts/gate.sh
          fi
