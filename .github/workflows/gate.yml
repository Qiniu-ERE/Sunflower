# 与本地同一条门禁：scripts/gate.sh。私有免费仓没有 required check，
# 合入由 scripts/merge.sh 把关——它要求本 workflow 在 PR 头提交上全绿。
name: gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited：改 PR 正文的「规格」段要重跑
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 默认 6 小时：apt 源卡住时整个 PR 会被挂半天
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: ffmpeg（TG 入口的语音转码 OGG/Opus ↔ PCM；尽力装）
        # 有的 runner 网速极慢：2026-10-23 同一时段换官方源也只下到 0.6–12 MB / 120 s，旁边的 job 43 s 跑完。
        # 装不上就跳过语音往返那一条单测、在这一步标黄；merge.sh 合入前在本机（有 ffmpeg）重跑全量门禁，覆盖不丢
        timeout-minutes: 3
        continue-on-error: true
        run: sudo apt-get -q update && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: scripts/gate.sh
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/gate.sh --base "origin/$BASE_REF"
          else
            scripts/gate.sh
          fi
