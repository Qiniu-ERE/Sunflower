# 与本地同一条门禁：scripts/gate.sh。私有免费仓没有 required check，
# 合入由 scripts/merge.sh 把关——它要求本 workflow 在 PR 头提交上全绿。
name: gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited：改 PR 正文的「规格」段要重跑
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 默认 6 小时：apt 源卡住时整个 PR 会被挂半天
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: ffmpeg（TG 入口的语音转码 OGG/Opus ↔ PCM）
        timeout-minutes: 7
        # runner 默认的 azure 镜像偶尔下载卡死（2026-10-23：同一个包连卡 3 次、每次 120 s）。
        # 每次限 120 s（timeout 在 sudo 里面，杀的是 apt 本身）；重试前把官方源排到镜像列表最前面
        run: |
          for i in 1 2 3; do
            sudo timeout -k 5 120 sh -c 'apt-get -q update && apt-get install -y -q --no-install-recommends ffmpeg' && exit 0
            echo "apt 第 $i 次没装上，改用官方源重试"
            { echo http://archive.ubuntu.com/ubuntu/; cat /etc/apt/apt-mirrors.txt; } | sudo tee /etc/apt/apt-mirrors.txt.new >/dev/null
            sudo mv /etc/apt/apt-mirrors.txt.new /etc/apt/apt-mirrors.txt
          done
          exit 1
      - name: scripts/gate.sh
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/gate.sh --base "origin/$BASE_REF"
          else
            scripts/gate.sh
          fi
